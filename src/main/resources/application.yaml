spring:
  application:
    name: API-Gateway

  cloud:
    gateway:
      routes:

        - id: user-service
          uri: http://localhost:9091
          predicates:
            - Path=/user/**

        - id: order-service
          uri: http://localhost:1101
          predicates:
            - Path=/order/**
          filters:
           - StripPrefix=1

        - id: payment-service
          uri: http://localhost:1201
          predicates:
            - Path=/payment/**

        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1

        - id: email-service
          uri: http://localhost:8082
          predicates:
            - Path=/email/**

springdoc:
  swagger-ui:
    urls:
#      - name: user-service
#        url: /user/v3/api-docs
